<!doctype html><html lang="kk"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Гуманитарлық пән мұғалімінің жұмысындағы ChatGPT</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f6ff;color:#17203a;font:20px system-ui}main{text-align:center;padding:32px}progress{width:min(440px,80vw);accent-color:#4632ff}p{font-size:16px}</style><main><h1>ChatGPT Edu · Семинар</h1><p id="status">Презентация жүктелуде… / Загружаем презентацию…</p><progress id="progress" max="8" value="0"></progress></main><script>(async()=>{try{const names=["seminar-01.bin", "seminar-02.bin", "seminar-03.bin", "seminar-04.bin", "seminar-05.bin", "seminar-06.bin", "seminar-07.bin", "seminar-08.bin"],chunks=[];for(const name of names){const response=await fetch(name);if(!response.ok)throw Error('HTTP '+response.status);chunks.push(await response.arrayBuffer());document.getElementById('progress').value=chunks.length}const stream=new Blob(chunks).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close()}catch(e){document.getElementById('status').textContent='Не удалось загрузить презентацию. Обновите страницу. '+e.message}})();</script></html>
